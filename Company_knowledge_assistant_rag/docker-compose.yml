services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: company_kb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d company_kb"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/company_kb
      HF_HOME: /models
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - hfcache:/models

volumes:
  pgdata:
  hfcache:
