<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YouTube Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      width: 400px;
      height: 550px;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #1a1a1a;
      padding: 10px 14px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 { font-size: 13px; font-weight: 600; color: #ff4444; }
    .status { font-size: 11px; color: #888; margin-left: auto; }
    .status.ready { color: #4caf50; }
    .status.loading { color: #ff9800; }
    .status.error { color: #f44336; }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 90%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start;
      background: #262626;
      border: 1px solid #333;
      border-bottom-left-radius: 4px;
    }

    .timestamp-link {
      color: #60a5fa;
      cursor: pointer;
      text-decoration: underline;
      font-weight: 500;
    }
    .timestamp-link:hover { color: #93bbfc; }

    .sources-toggle {
      font-size: 10px;
      color: #888;
      cursor: pointer;
      margin-top: 4px;
    }
    .sources-toggle:hover { color: #aaa; }
    .sources-list {
      display: none;
      margin-top: 4px;
      padding-left: 8px;
      border-left: 2px solid #444;
      font-size: 10px;
      color: #999;
    }
    .sources-list.open { display: block; }

    .grounding-badge {
      display: inline-block;
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 4px;
      margin-top: 4px;
    }
    .grounding-badge.grounded { background: #1b4332; color: #6ee7b7; }
    .grounding-badge.ungrounded { background: #451a1a; color: #fca5a5; }

    .input-area {
      padding: 10px 14px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      gap: 6px;
    }
    .input-area input {
      flex: 1;
      background: #262626;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 12px;
      color: #e8e8e8;
      font-size: 12px;
      outline: none;
    }
    .input-area input:focus { border-color: #2563eb; }
    .input-area input::placeholder { color: #666; }

    .input-area button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-area button:hover:not(:disabled) { background: #1d4ed8; }

    .welcome {
      text-align: center;
      color: #666;
      padding: 30px 16px;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>▶ YouTube Chatbot</h1>
    <span id="status" class="status">Connecting...</span>
  </div>

  <div class="chat-container" id="chat">
    <div class="welcome" id="welcome">
      Open a YouTube video and click this extension to start chatting.
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask about this video..." autocomplete="off" disabled />
    <button id="sendBtn" disabled>Send</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
