<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>🎓 Student Management System</h1>

    <!-- Student Form -->
    <div class="card">

        <h2>Add / Update Student</h2>

        <!-- Hidden field used while editing -->
        <input
            type="hidden"
            id="studentId">

        <input
            type="text"
            id="name"
            placeholder="Student Name"
            required>

        <input
            type="number"
            id="age"
            placeholder="Age"
            required>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <input
            type="text"
            id="course"
            placeholder="Course"
            required>

        <div class="button-group">

            <button
                type="button"
                onclick="saveStudent()">

                Save Student

            </button>

            <button
                type="button"
                onclick="clearForm()">

                Reset

            </button>

        </div>

    </div>

    <!-- Student Table -->
    <div class="card">

        <h2>Student Records</h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Edit</th>
                    <th>Delete</th>

                </tr>

            </thead>

            <tbody id="studentTable">

                <!-- JavaScript will insert rows here -->

            </tbody>

        </table>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
